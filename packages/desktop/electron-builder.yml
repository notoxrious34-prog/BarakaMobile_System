appId: com.barakamobile.app
productName: BarakaMobile
directories:
  output: ../../dist-electron
files:
  - dist/**
  - ../../packages/backend/dist/**
  - ../../packages/frontend/dist/**
  - node_modules/**
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - ar
    - en